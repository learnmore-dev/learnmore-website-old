name: Deploy to VPS Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Linux VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            # Navigate to project directory
            cd ${{ secrets.SERVER_PROJECT_PATH || '/home/ubuntu/learnmore-nextjs' }}

            # Pull latest changes
            echo "📥 Pulling latest changes from git..."
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies
            echo "📦 Installing dependencies..."
            npm ci --production=false

            # Clear previous Next build cache to prevent chunk hash collisions
            echo "🧹 Cleaning old build cache..."
            rm -rf .next/cache

            # Build Next.js application
            echo "🔨 Building Next.js project..."
            npm run build

            # Ensure proper file permissions so Nginx/webserver can serve static assets without 403
            echo "🔒 Setting permissions for static assets..."
            chmod -R 755 .next public || true

            # Restart application using PM2 (use restart instead of reload for complete worker refresh)
            echo "🚀 Restarting PM2 process..."
            if pm2 describe "${{ secrets.PM2_APP_NAME || 'learnmore-app' }}" > /dev/null 2>&1; then
              pm2 restart "${{ secrets.PM2_APP_NAME || 'learnmore-app' }}" --update-env
            else
              pm2 start npm --name "${{ secrets.PM2_APP_NAME || 'learnmore-app' }}" -- start
            fi

            # Save PM2 state
            pm2 save

            # Reload Nginx if possible to flush any proxy caches
            echo "🔄 Refreshing Nginx web server..."
            sudo systemctl reload nginx 2>/dev/null || sudo service nginx reload 2>/dev/null || true

            echo "✅ Deployment completed successfully!"
