name: Deploy to VPS Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Linux VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            # Navigate to project directory
            cd ${{ secrets.SERVER_PROJECT_PATH || '/home/ubuntu/learnmore-nextjs' }}

            # Pull latest changes
            echo "📥 Pulling latest changes from git..."
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies
            echo "📦 Installing dependencies..."
            npm ci --production=false

            # Build Next.js application
            echo "🔨 Building Next.js project..."
            npm run build

            # Restart application using PM2
            echo "🚀 Restarting PM2 process..."
            if pm2 describe "${{ secrets.PM2_APP_NAME || 'learnmore-app' }}" > /dev/null 2>&1; then
              pm2 reload "${{ secrets.PM2_APP_NAME || 'learnmore-app' }}" --update-env
            else
              pm2 start npm --name "${{ secrets.PM2_APP_NAME || 'learnmore-app' }}" -- start
            fi

            # Save PM2 state
            pm2 save

            echo "✅ Deployment completed successfully!"
